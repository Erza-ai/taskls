services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskls-app
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Persists daily submissions JSON database in a named Docker volume
      - taskls-data:/app/data
    environment:
      - EMPLOYEES=${EMPLOYEES:-Lisa (PM),Fino (AI),Owen (QA),Aris (BA),Nafi (UI/UX),Atha (FE),Eril (BE)}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - AI_API_KEY=${AI_API_KEY:-}
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID:-}
      - GOOGLE_SERVICE_ACCOUNT_KEY=${GOOGLE_SERVICE_ACCOUNT_KEY:-}
      - NODE_ENV=${APP_ENV:-production}
      - TASKLS_API_KEY=${TASKLS_API_KEY:-your-secret-key}
    restart: unless-stopped

volumes:
  taskls-data:
